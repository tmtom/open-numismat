name: "Snapshot (master_tm)"

# Automatic development builds for the fork's "master_tm" branch.
#
# Same idea as upstream's "Snapshot" workflow on "master" (same build matrix),
# except:
#   - it triggers on "master_tm" only, so upstream's "master" is never touched;
#   - the OpenNumismat/ImageEditor submodule is built at the head of the fork's
#     "main_tm" branch (resolved once per run in the "title" job), not at the
#     pinned gitlink commit;
#   - only the latest build is kept: artifacts of previous runs are dropped and
#     every deliverable is published to the rolling "master_tm-latest"
#     pre-release ("Development Build (master_tm)"), with the asset names
#     marked as "<name>-master_tm-<sha7>-<flavor>";
#   - no code signing (SignPath is upstream-only and is skipped here).

on:
  push:
    branches: [ "master_tm" ]
    paths-ignore:
      - 'OpenNumismat/resources/i18n/*'
      - 'icons/*'
      - 'OpenNumismat/resources/resources.qrc'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      APPNAME: OpenNumismat
      VERSION: ${{ steps.bump.outputs.current-version }}.${{ steps.bump.outputs.current-release }}
      PACKAGENAME: OpenNumismat-${{ steps.bump.outputs.current-version }}.${{ steps.bump.outputs.current-release }}
      SHA_SHORT: ${{ steps.meta.outputs.sha-short }}
      IME_SHA: ${{ steps.meta.outputs.ime-sha }}
      IME_SHORT: ${{ steps.meta.outputs.ime-short }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Drop artifacts of previous runs
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
          --jq ".artifacts[] | select(.expired == false and .workflow_run.id != ${{ github.run_id }}) | .id" |
        while read -r id; do
          echo "Dropping stale artifact $id"
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
        done
    - name: Meta
      id: meta
      shell: bash
      run: |
        echo "sha-short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
        url=$(git config -f .gitmodules --get submodule.OpenNumismat/ImageEditor.url)
        ime=$(git ls-remote "$url" refs/heads/main_tm | cut -f1)
        if [ -z "$ime" ]; then
          echo "Cannot resolve head of main_tm in $url" >&2
          exit 1
        fi
        echo "ime-sha=$ime" >> "$GITHUB_OUTPUT"
        echo "ime-short=${ime:0:7}" >> "$GITHUB_OUTPUT"
        echo "ImageEditor main_tm head: $ime"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install click==8.2 bump-my-version==0.32.1
    - name: Get current version
      id: bump
      shell: bash
      run: |
        echo "current-version=$(bump-my-version show current_version)" >> $GITHUB_OUTPUT
        echo "current-release=$(bump-my-version show scm_info.distance_to_latest_tag)" >> $GITHUB_OUTPUT

  windows:
    needs: [title]
    name: Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
    - name: Use ImageEditor main_tm head
      shell: bash
      run: |
        git -C OpenNumismat/ImageEditor fetch --depth 2147483647 origin main_tm
        git -C OpenNumismat/ImageEditor checkout --detach ${{ needs.title.outputs.IME_SHA }}
        echo "ImageEditor at $(git -C OpenNumismat/ImageEditor rev-parse HEAD)"
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install click==8.2 bump-my-version==0.32.1 pyinstaller
    - name: Bump pre-release version
      run: |
        bump-my-version bump pre --no-commit --allow-dirty --verbose --serialize "{major}.{minor}.{patch}.{distance_to_latest_tag}"
    - name: Create private keys
      run: |
        touch OpenNumismat/private_keys.py
        echo "FINANCE_PROXY = '${{ secrets.FINANCE_PROXY }}'" >> OpenNumismat/private_keys.py
        echo "COLNECT_PROXY = '${{ secrets.COLNECT_PROXY }}'" >> OpenNumismat/private_keys.py
        echo "COLNECT_KEY = '${{ secrets.COLNECT_KEY }}'" >> OpenNumismat/private_keys.py
        echo "NUMISTA_API_KEY = '${{ secrets.NUMISTA_API_KEY }}'" >> OpenNumismat/private_keys.py
        echo "MAPBOX_ACCESS_TOKEN = '${{ secrets.MAPBOX_ACCESS_TOKEN }}'" >> OpenNumismat/private_keys.py
    - name: Patch portable
      uses: ./.github/actions/replace-string-in-file
      with:
        file: OpenNumismat/version.py
        old-string: "Portable = False"
        new-string: "Portable = True"
    - name: build
      run: |
        SET PYTHONOPTIMIZE=1
        pyinstaller open-numismat-portable.spec
    - name: install libgphoto2 runtime
      shell: bash
      run: |
        # MSYS2 mirrors occasionally answer 429 when several jobs download
        # packages in parallel, so retry with backoff before giving up.
        for i in 1 2 3 4; do
          if C:/msys64/usr/bin/bash.exe -lc "pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-libgphoto2"; then
            exit 0
          fi
          echo "pacman attempt $i failed, retrying in $((i * 20))s..."
          sleep $((i * 20))
        done
        echo "pacman failed after 4 attempts" >&2
        exit 1
    - name: bundle libgphoto2
      run: python OpenNumismat/ImageEditor/misc/bundle_gphoto2.py dist/${{ needs.title.outputs.APPNAME }}
    - name: test libgphoto2 bundle
      run: python OpenNumismat/ImageEditor/misc/test_gphoto2_bundle.py dist/${{ needs.title.outputs.APPNAME }}
    - name: Upload
      id: upload-portable
      uses: actions/upload-artifact@v7
      with:
        name: ${{ needs.title.outputs.APPNAME }}-portable
        path: dist/${{ needs.title.outputs.APPNAME }}/${{ needs.title.outputs.APPNAME }}.exe
        if-no-files-found: error
    - name: Signing
      if: ${{ github.repository_owner == 'OpenNumismat' }}
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '3b087850-3844-4d25-8407-cf81e731f8d1'
        project-slug: 'open-numismat'
        signing-policy-slug: 'test-signing'
        artifact-configuration-slug: 'test-zip'
        github-artifact-id: '${{steps.upload-portable.outputs.artifact-id}}'
        output-artifact-directory: dist/${{ needs.title.outputs.APPNAME }}
        wait-for-completion: true
    - name: package
      run: |
        cd dist
        7z a -tzip -mx=9 -mfb=258 -mpass=15 -r ../${{ needs.title.outputs.PACKAGENAME }}.zip ${{ needs.title.outputs.APPNAME }}
    - name: Upload zip
      uses: actions/upload-artifact@v7
      with:
        name: ${{ needs.title.outputs.PACKAGENAME }}-portable-signed
        path: ${{ needs.title.outputs.PACKAGENAME }}.zip
        if-no-files-found: error

  innosetup:
    needs: [title]
    name: InnoSetup
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
    - name: Use ImageEditor main_tm head
      shell: bash
      run: |
        git -C OpenNumismat/ImageEditor fetch --depth 2147483647 origin main_tm
        git -C OpenNumismat/ImageEditor checkout --detach ${{ needs.title.outputs.IME_SHA }}
        echo "ImageEditor at $(git -C OpenNumismat/ImageEditor rev-parse HEAD)"
    - uses: actions/setup-python@v7
