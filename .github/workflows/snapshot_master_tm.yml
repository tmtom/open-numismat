  publish:
    name: Publish latest build
    needs: [title, windows, innosetup, ubuntu, ubuntu-24, ubuntu-26, macos, macos-arm64, nuitka, nuitka_innosetup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Mark deliverables
      shell: bash
      run: |
        set -euo pipefail
        P='${{ needs.title.outputs.PACKAGENAME }}'
        V='${{ needs.title.outputs.VERSION }}'
        M="master_tm-${{ needs.title.outputs.SHA_SHORT }}"
        mkdir dist
        cp "artifacts/${P}-portable-signed/${P}.zip"                  "dist/OpenNumismat-${V}-${M}-portable.zip"
        cp "artifacts/${P}/${P}.exe"                                  "dist/OpenNumismat-${V}-${M}-setup.exe"
        cp "artifacts/${P}-nuitka-portable-signed/${P}-nuitka.zip"    "dist/OpenNumismat-${V}-${M}-nuitka-portable.zip"
        cp "artifacts/${P}-nuitka/${P}-nuitka.exe"                    "dist/OpenNumismat-${V}-${M}-nuitka-setup.exe"
        cp "artifacts/${P}-deb/open-numismat_${V}_all.deb"            "dist/open-numismat_${V}-${M}_all.deb"
        cp "artifacts/${P}-deb-24/open-numismat_${V}_all_24.deb"      "dist/open-numismat_${V}-${M}_all_24.deb"
        cp "artifacts/${P}-deb-26/open-numismat_${V}_all_26.deb"      "dist/open-numismat_${V}-${M}_all_26.deb"
        cp "artifacts/${P}-dmg/${P}-macos15.dmg"                      "dist/OpenNumismat-${V}-${M}-macos15.dmg"
        cp "artifacts/${P}-dmg-arm64/${P}-macos15-arm64.dmg"          "dist/OpenNumismat-${V}-${M}-macos15-arm64.dmg"
        ls -l dist
    - name: Release notes
      shell: bash
      run: |
        {
          echo "Rolling development build of branch \`master_tm\` (upstream \`master\` + own features). Only the latest build is kept."
          echo
          echo "- Commit: \`${{ github.sha }}\` (\`master_tm\`)"
          echo "- ImageEditor submodule: \`${{ needs.title.outputs.IME_SHA }}\` (\`main_tm\` head)"
          echo "- Version: ${{ needs.title.outputs.VERSION }}"
          echo "- Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo
          echo "Not an official release. Unsigned (SignPath signing runs on upstream only)."
        } > notes.md
        cat notes.md
    - name: Release
      shell: bash
      env:
        GH_REPO: ${{ github.repository }}
      run: |
        tag="master_tm-latest"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release delete "$tag" --yes --cleanup-tag
        fi
        gh release create "$tag" dist/* \
          --prerelease \
          --title "Development Build (master_tm)" \
          --target "$GITHUB_SHA" \
          --notes-file notes.md
